services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roomfinds
      POSTGRES_USER: roomfinds
      POSTGRES_PASSWORD: roomfinds
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["roomfinds-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomfinds -d roomfinds"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/roomfinds
      DB_USER: roomfinds
      DB_PASSWORD: roomfinds
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-true}
      API_INTERNAL_URL: http://backend:8080
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on: [backend]
volumes:
  roomfinds-data:
